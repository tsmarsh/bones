name: Build and Release Book

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Setup Tectonic
        uses: wtfjoke/setup-tectonic@v2 # Use the setup-tectonic action
        with:
          tectonic-version: latest # Specify the Tectonic version (e.g., 'latest' or a specific version like '0.12.0')
          biber-version: latest # Optionally, setup Biber for bibliography processing

      - name: Install Bones
        run: |
          git clone https://github.com/tsmarsh/bones.git /tmp/bones
          cd /tmp/bones
          sudo make install

      - name: Build PDF
        run: bones pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-pdf
          path: book.pdf

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: book.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
